name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Chấp nhận giấy phép Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        run: gradle assembleRelease --no-daemon -PAPP_URL="${{ vars.APP_URL }}" -PVERSION_CODE=${{ github.run_number }}

      - name: Đổi tên file APK
        run: cp app/build/outputs/apk/release/app-release.apk KuSuuPOS.apk

      - name: Tải APK lên (mục Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: KuSuuPOS-apk
          path: KuSuuPOS.apk
          retention-days: 90
